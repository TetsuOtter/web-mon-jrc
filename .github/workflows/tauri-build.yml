name: Tauri Build

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Yarn
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build canvas-renderer
        run: yarn workspace @web-mon-jrc/canvas-renderer build

      - name: Build frontend
        working-directory: ./dev/app
        run: yarn build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dev/app/dist
          retention-days: 1

  build-macos:
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dev/app/dist

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "dev/app/src-tauri"
          cache-on-failure: true
          prefix-key: ${{ matrix.target }}

      - name: Setup Yarn
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build canvas-renderer
        run: yarn workspace @web-mon-jrc/canvas-renderer build

      - name: Build Icon
        working-directory: ./dev/app
        run: yarn tauri:icon

      - name: Build Tauri app
        working-directory: ./dev/app
        run: bash build.sh "--target ${{ matrix.target }}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-app-macos-${{ contains(matrix.target, 'aarch64') && 'aarch64' || 'x86_64' }}
          path: |
            dev/app/src-tauri/target/*/release/bundle/dmg/*.dmg
            dev/app/src-tauri/target/*/release/bundle/macos/*.app

  build:
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dev/app/dist

      - name: Setup Yarn
        shell: bash
        run: |
          npm uninstall -g yarn
          corepack enable
          corepack prepare yarn --activate
          echo "YARN_CACHE_FOLDER=${{ github.workspace }}/.yarn-cache" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.yarn-cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "dev/app/src-tauri"
          cache-on-failure: true
          prefix-key: ${{ matrix.platform }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build canvas-renderer
        run: yarn workspace @web-mon-jrc/canvas-renderer build

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build Icon
        working-directory: ./dev/app
        run: yarn tauri:icon

      - name: Build Tauri app
        working-directory: ./dev/app
        run: yarn tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04' && success()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-app-linux
          path: |
            dev/app/src-tauri/target/release/bundle/deb/*.deb
            dev/app/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest' && success()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-app-windows
          path: |
            dev/app/src-tauri/target/release/bundle/msi/*.msi
            dev/app/src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: [build-macos, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            tauri-app-macos-*/**/*
            tauri-app-linux/**/*
            tauri-app-windows/**/*
          draft: true
          generate_release_notes: true
