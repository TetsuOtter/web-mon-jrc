name: Lint

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - dev/app
          - dev/canvas-renderer
          - dev/canvas-demo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: ${{ matrix.directory }}/yarn.lock

      - name: Setup Yarn
        run: corepack enable

      - name: Install dependencies (${{ matrix.directory }})
        working-directory: ${{ matrix.directory }}
        run: yarn install --frozen-lockfile

      - name: Run lint (${{ matrix.directory }})
        working-directory: ${{ matrix.directory }}
        run: yarn lint
